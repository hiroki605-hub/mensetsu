  if(FB){for(let i=0;i<items.length;i+=400){const b=fdb.batch();items.slice(i,i+400).forEach(({id,...d})=>b.set(id?fdb.collection(c).doc(id):fdb.collection(c).doc(),d));await b.commit()}return}
  let a=LS.get(c);const ids=new Set(items.map(x=>x.id).filter(Boolean));a=a.filter(x=>!ids.has(x.id));
  items.forEach(x=>a.push({...x,id:x.id||Date.now().toString(36)+Math.random().toString(36).slice(2,7)}));LS.set(c,a);cache[c]=a;onChange();
}
async function delMany(c,ids){
  if(FB){for(let i=0;i<ids.length;i+=400){const b=fdb.batch();ids.slice(i,i+400).forEach(id=>b.delete(fdb.collection(c).doc(id)));await b.commit()}return}
  const s=new Set(ids),a=LS.get(c).filter(x=>!s.has(x.id));LS.set(c,a);cache[c]=a;onChange();
}

/* ===== 画面切替 ===== */
const root=$('#root');
function route(){ MODE==='teacher'?teacherView():studentView(); }
function modeNote(){return FB?'':'<div class="warn noprint">⚠ お試しモード：Firebase未設定のため、データはこのブラウザ内にだけ保存されます（READMEの手順で設定すると全員で共有されます）。</div>'}

/* ================= 生徒画面 ================= */
function studentView(){
  onChange=()=>{};watch('roster');watch('recent');
  const cy=curYear();let cat='',sel=null,idx=-1;
  root.innerHTML=`<h1>面接 振り返りシート</h1><p class="sub">受験した高校の面接について、後輩のために振り返りを書いてください。（名前は書きません）</p>${modeNote()}<div id="done"></div>
  <div class="card"><label>入試年度</label><select id="yr">${[cy+1,cy,cy-1,cy-2].map(y=>`<option value="${y}" ${y==cy?'selected':''}>${yl(y)}</option>`).join('')}</select>
  <div class="row"><div><label>クラス</label><select id="cls"></select></div><div><label>出席番号</label><select id="no"></select></div></div>
  <div id="rmsg" class="hint"></div></div>
  <div class="card"><label>受験区分</label><div class="cats">${Object.entries(CATN).map(([k,v])=>`<label><input type="radio" name="cat" value="${k}"><span>${v}</span></label>`).join('')}</div>
  <label>高校名（途中まで入力すると候補が出ます）</label><div class="combo"><input id="sch" autocomplete="off" placeholder="先に受験区分を選んでください" disabled><div class="dd" id="dd" hidden></div></div></div>
  <div class="card"><div class="row3"><div><label>面接の形式</label><select id="fmt"><option>個人面接</option><option>集団面接</option><option>グループ討論</option><option>その他</option></select></div>
  <div><label>面接時間（分）</label><input id="mins" type="number" min="1" max="120"></div><div><label>面接官の人数</label><input id="cnt" type="number" min="1" max="10"></div></div>
  ${FIELDS.map(([k,t])=>`<label>${t}</label><textarea id="f_${k}"></textarea>`).join('')}
  <button class="big" id="go">提出する</button></div>
  `;
  const yr=$('#yr'),cls=$('#cls'),no=$('#no'),sch=$('#sch'),dd=$('#dd');
  function syncRoster(){
    const y=+yr.value,rs=cache.roster.filter(r=>r.year===y),pc=cls.value,pn=no.value;
    const cs=[...new Set(rs.map(r=>r.cls))].sort(nat);
    cls.innerHTML=cs.length?cs.map(c=>`<option value="${esc(c)}">${esc(c)}組</option>`).join(''):'<option value="">（名簿なし）</option>';
    if(cs.includes(pc))cls.value=pc;syncNo(pn);
    $('#rmsg').textContent=cs.length?'':'この年度の名簿が登録されていません。先生に伝えてください。';
  }
  function syncNo(pn){
    const y=+yr.value,ns=cache.roster.filter(r=>r.year===y&&r.cls===cls.value).map(r=>r.no).sort(nat);
    no.innerHTML=ns.map(n=>`<option value="${esc(n)}">${esc(n)}番</option>`).join('');if(ns.includes(pn))no.value=pn;
  }
  onChange=syncRoster;syncRoster();yr.onchange=syncRoster;cls.onchange=()=>syncNo();
  /* --- 高校名コンボボックス --- */
  $$('input[name=cat]').forEach(r=>r.onchange=()=>{cat=r.value;sel=null;sch.value='';sch.disabled=false;sch.placeholder='例）「ならき」「天理」「ﾃﾞｻﾞｲﾝ」など';sch.focus();draw()});
  const hl=(t,q)=>{let h=esc(t);q.split(/\s+/).filter(Boolean).forEach(w=>{const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');h=h.replace(new RegExp('('+e+')(?![^<]*>)','gi'),'<mark>$1</mark>')});return h};
  let rows=[];
  function draw(){
    if(!cat){dd.hidden=true;return}
    const q=sch.value.trim(),toks=q.split(/\s+/).map(norm).filter(Boolean);
    const rec=cache.recent.filter(r=>r.cat===cat).sort((a,b)=>b.ts-a.ts).slice(0,5).map(r=>r.school);
    rows=[];(SCHOOLS[cat]||[]).forEach(([school,cs])=>cs.forEach(([code,course,name])=>{const hay=norm(school+name+course);
      if(toks.every(t=>hay.includes(t)))rows.push({code,school,course,r:rec.indexOf(school),s:toks.length&&norm(school).startsWith(toks[0])?0:1})}));
    rows.sort((a,b)=>((a.r<0)-(b.r<0))||(a.r-b.r)||(a.s-b.s));
    let h='',last='';
    rows.forEach((o,i)=>{
      if(!toks.length){const g=o.r>=0?'最近選ばれた高校（全コース）':'すべての高校';if(g!==last){h+=`<div class="h">${g}</div>`;last=g}}
      h+=`<div class="o${i===idx?' on':''}" data-i="${i}">${hl(o.school,q)}${o.course?`<small>${hl(o.course,q)}</small>`:''}${toks.length&&o.r>=0?'<span class="rc">最近</span>':''}</div>`});
    if(q)h+=`<div class="o" data-i="x">「${esc(q)}」をこのまま入力（リストにない高校）</div>`;
    if(!rows.length&&!q)h='<div class="h">候補がありません</div>';
    dd.innerHTML=h;dd.hidden=false;
  }
  function pick(o){sel=o==='x'?{code:0,school:sch.value.trim(),course:''}:rows[+o];sch.value=sel.school+(sel.course?`［${sel.course}］`:'');dd.hidden=true}
  sch.oninput=()=>{sel=null;idx=-1;draw()};sch.onfocus=()=>{idx=-1;draw()};
  sch.onkeydown=e=>{if(dd.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();idx=Math.max(0,Math.min(rows.length-1,idx+(e.key==='ArrowDown'?1:-1)));draw();$('.o.on',dd)?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'&&idx>=0){e.preventDefault();pick(idx)}else if(e.key==='Escape')dd.hidden=true};
  dd.onmousedown=e=>{const o=e.target.closest('.o');if(o){e.preventDefault();pick(o.dataset.i)}};
  sch.onblur=()=>setTimeout(()=>dd.hidden=true,120);
  /* --- 提出 --- */
  $('#go').onclick=async()=>{
    if(!cls.value||!no.value)return alert('クラスと出席番号を選んでください。');
    if(!cat)return alert('受験区分を選んでください。');
    if(!sel){const t=sch.value.trim();if(!t)return alert('高校名を選んでください。');sel={code:0,school:t,course:''}}
    if(!FIELDS.some(([k])=>$('#f_'+k).value.trim()))return alert('振り返りを1つ以上書いてください。');
    const e={year:+yr.value,cls:cls.value,no:no.value,cat,code:sel.code,school:sel.school,course:sel.course,fmt:$('#fmt').value,mins:$('#mins').value,cnt:$('#cnt').value,ts:Date.now()};
    FIELDS.forEach(([k])=>e[k]=$('#f_'+k).value.trim());
    $('#go').disabled=true;
    try{await putMany('entries',[e]);await putMany('recent',[{id:(cat+'_'+sel.school).replace(/\//g,'_'),cat,school:sel.school,ts:e.ts}]);
      $('#done').innerHTML=`<div class="ok">✔ 提出しました（${esc(sel.school)}）。別の高校も受験した人は、続けて入力できます。</div>`;
      FIELDS.forEach(([k])=>$('#f_'+k).value='');$('#mins').value=$('#cnt').value='';sel=null;sch.value='';scrollTo(0,0);
    }catch(err){alert('送信に失敗しました：'+err.message)}$('#go').disabled=false;
  };
}

/* ================= 教師画面 ================= */
let tTab='list',F={y:'',cat:'',q:''},pick=new Set(),R={y:curYear(),sel:new Set()};
function teacherView(){
  watch('roster');watch('recent');
  watch('entries');onChange=()=>{if(tTab==='list')drawGroups();else drawRoster()};
  root.innerHTML=`<div class="noprint"><h1>教師用：面接振り返り</h1>${modeNote()}<div class="tabs"><button data-t="list">振り返り一覧（高校別）</button><button data-t="roster">名簿（クラス・出席番号）</button><span style="flex:1"></span><button class="s" onclick="location.href='index.html'">生徒用ページへ</button></div></div><div id="tb"></div>`;
  $$('.tabs [data-t]').forEach(b=>{b.classList.toggle('on',b.dataset.t===tTab);b.onclick=()=>{tTab=b.dataset.t;teacherView()}});
  tTab==='list'?listTab():rosterTab();
}
/* --- 振り返り一覧 --- */
const ORD=new Map();Object.entries(SCHOOLS).forEach(([c,a])=>a.forEach(([s],i)=>ORD.set(c+s,i)));
function listTab(){
  const ys=[...new Set(cache.entries.map(e=>e.year))].sort((a,b)=>b-a);
  $('#tb').innerHTML=`<div class="bar noprint"><select id="fy"><option value="">すべての年度</option>${ys.map(y=>`<option value="${y}" ${F.y==y?'selected':''}>${yl(y)}</option>`).join('')}</select>
  <select id="fc"><option value="">すべての区分</option>${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${F.cat===k?'selected':''}>${v}</option>`).join('')}</select>
  <input id="fq" placeholder="高校名・内容で絞り込み" value="${esc(F.q)}"><button id="pa" class="s">表示中をすべて印刷</button><button id="dsel" class="d">選択を削除</button><button id="dall" class="d">表示中をすべて削除</button></div><div id="sum" class="hint noprint"></div><div id="gl"></div>`;
  $('#fy').onchange=e=>{F.y=e.target.value;drawGroups()};$('#fc').onchange=e=>{F.cat=e.target.value;drawGroups()};$('#fq').oninput=e=>{F.q=e.target.value;drawGroups()};
  $('#pa').onclick=()=>{document.body.classList.remove('pr1');print()};
  $('#dsel').onclick=()=>delEntries([...pick],'選択した');$('#dall').onclick=()=>delEntries(filtered().map(e=>e.id),'表示中の');
  drawGroups();
}
function filtered(){const q=norm(F.q);return cache.entries.filter(e=>(!F.y||e.year==F.y)&&(!F.cat||e.cat===F.cat)&&(!q||norm([e.school,e.course,e.q,e.good,e.bad,e.adv].join(' ')).includes(q)))}
async function delEntries(ids,label){if(!ids.length)return alert('削除する対象がありません。');if(!confirm(`${label}振り返り ${ids.length}件を削除します。元に戻せません。よろしいですか？`))return;await delMany('entries',ids);ids.forEach(i=>pick.delete(i))}
function pv(a){
  const tag=e=>`<span class="y">${e.year}年度</span>${e.course?`［${esc(e.course)}］`:''}`;
  const inf=e=>[e.fmt,e.mins?e.mins+'分':'',e.cnt?'面接官'+e.cnt+'人':''].filter(Boolean).join('・');
  const info=a.filter(inf).map(e=>`<li>${tag(e)}${esc(inf(e))}</li>`).join('');
  return (info?`<div class="it"><h4>面接の形式・時間</h4><ul>${info}</ul></div>`:'')+FIELDS.map(([f,t])=>{const l=a.filter(e=>e[f]);return l.length?`<div class="it"><h4>${t.replace(/（.*$/,'')}</h4><ul>${l.map(e=>`<li>${tag(e)}${esc(e[f])}</li>`).join('')}</ul></div>`:''}).join('');
}
function drawGroups(){
  const gl=$('#gl');if(!gl)return;const es=filtered(),g=new Map();
  es.forEach(e=>{const k=e.cat+'\u0001'+e.school;if(!g.has(k))g.set(k,[]);g.get(k).push(e)});
  const ks=[...g.keys()].sort((a,b)=>{const[ca,sa]=a.split('\u0001'),[cb,sb]=b.split('\u0001'),co=Object.keys(CATN);return co.indexOf(ca)-co.indexOf(cb)||((ORD.get(ca+sa)??9999)-(ORD.get(cb+sb)??9999))||nat(sa,sb)});
  $('#sum').textContent=`表示中：${ks.length}校 / ${es.length}件`;$('#dsel').textContent=`選択を削除（${pick.size}）`;
  gl.innerHTML=ks.length?ks.map((k,gi)=>{const[c,s]=k.split('\u0001'),a=g.get(k).sort((x,y)=>y.year-x.year||y.ts-x.ts),yrs=[...new Set(a.map(e=>e.year))];
    return`<div class="group" data-g="${gi}"><div class="gh"><h3>${esc(s)}<small>${CATN[c]||''}・${a.length}件・${yrs.map(y=>y+'年度').join(' ')}</small></h3><span class="noprint"><button data-pr="${gi}">この高校を印刷</button> <button data-dg="${gi}">この高校を全削除</button></span></div>
    <div class="ph">${esc(s)}　面接の振り返り（先輩より）</div>${a.map(e=>`<div class="e"><div class="eh"><input type="checkbox" class="noprint" style="width:auto" data-id="${e.id}" ${pick.has(e.id)?'checked':''}><span class="yr">${yl(e.year)}</span>${e.course?`<span class="tg">${esc(e.course)}</span>`:''}<span class="tg">${esc(e.fmt||'')}${e.mins?'・'+esc(e.mins)+'分':''}${e.cnt?'・面接官'+esc(e.cnt)+'人':''}</span><span class="who noprint">${esc(e.cls)}組${esc(e.no)}番</span><button class="d noprint" style="padding:1px 8px;font-size:12px" data-de="${e.id}">削除</button></div>
    ${FIELDS.filter(([f])=>e[f]).map(([f,t])=>`<div class="f"><b>${t}</b><div>${esc(e[f])}</div></div>`).join('')}</div>`).join('')}<div class="pv">${pv(a)}</div></div>`}).join(''):'<div class="card hint">該当する振り返りはまだありません。</div>';
  const groups=[...gl.children];
  $$('[data-id]',gl).forEach(c=>c.onchange=()=>{c.checked?pick.add(c.dataset.id):pick.delete(c.dataset.id);$('#dsel').textContent=`選択を削除（${pick.size}）`});
  $$('[data-de]',gl).forEach(b=>b.onclick=()=>delEntries([b.dataset.de],'この'));
  $$('[data-dg]',gl).forEach(b=>b.onclick=()=>delEntries(g.get(ks[+b.dataset.dg]).map(e=>e.id),'この高校の'));
  $$('[data-pr]',gl).forEach(b=>b.onclick=()=>{const el=groups[+b.dataset.pr];el.classList.add('pr');document.body.classList.add('pr1');print();setTimeout(()=>{el.classList.remove('pr');document.body.classList.remove('pr1')},500)});
}
/* --- 名簿 --- */
function rosterTab(){
  const ys=[...new Set([curYear()-1,curYear(),curYear()+1,R.y,...cache.roster.map(r=>r.year)])].sort((a,b)=>b-a);
  $('#tb').innerHTML=`<div class="card"><label>対象年度</label><select id="ry">${ys.map(y=>`<option value="${y}" ${y==R.y?'selected':''}>${yl(y)}</option>`).join('')}</select>
  <div class="row"><div><label>クラス（複数可）</label><input id="rc" placeholder="例）1-4　または　1,2,3"></div><div><label>出席番号（範囲・複数可）</label><input id="rn" placeholder="例）1-35　または　1-30,33,35"></div></div>
  <div class="bar" style="margin-top:10px"><button id="radd">追加登録（クラス×番号を一括）</button><button id="rdel" class="d">上の指定で削除（クラス空欄＝全クラス）</button></div>
  <div class="hint">例：クラス「1-4」・番号「1-35」で、1〜4組の1〜35番を一括登録／削除できます。</div></div>
  <div class="card"><div class="bar"><span id="rinfo"></span><button id="rsel" class="d">選択した番号を削除</button><button id="rall" class="d">この年度の名簿を全削除</button><label style="margin:0;font-weight:500;display:flex;gap:4px"><input type="checkbox" id="rwe" style="width:auto">提出済みの振り返りも一緒に削除</label></div>
  <div class="hint">番号をクリックで選択（赤）。緑の下線＝提出済み。</div><div id="rg"></div></div>`;
  $('#ry').onchange=e=>{R.y=+e.target.value;R.sel.clear();drawRoster()};
  $('#radd').onclick=async()=>{const cs=parseList($('#rc').value),ns=parseList($('#rn').value);if(!cs.length||!ns.length)return alert('クラスと出席番号を入力してください。');
    const it=[];cs.forEach(c=>ns.forEach(n=>it.push({id:`${R.y}_${c}_${n}`,year:R.y,cls:c,no:n})));await putMany('roster',it);alert(`${it.length}人分を登録しました。`)};
  $('#rdel').onclick=()=>{const cs=$('#rc').value.trim()?parseList($('#rc').value):null,ns=parseList($('#rn').value);if(!ns.length)return alert('削除する出席番号を入力してください。');
    rdel(cache.roster.filter(r=>r.year===R.y&&(!cs||cs.includes(r.cls))&&ns.includes(r.no)),'指定した')};
  $('#rsel').onclick=()=>rdel(cache.roster.filter(r=>R.sel.has(r.id)),'選択した');
  $('#rall').onclick=()=>rdel(cache.roster.filter(r=>r.year===R.y),R.y+'年度の')
  drawRoster();
}
async function rdel(rs,label){
  if(!rs.length)return alert('該当する名簿がありません。');
  const we=$('#rwe').checked,es=we?cache.entries.filter(e=>rs.some(r=>r.year===e.year&&r.cls===e.cls&&r.no===e.no)):[];
  if(!confirm(`${label}名簿 ${rs.length}人分を削除します。${we?`\n提出済みの振り返り ${es.length}件も削除されます。`:'\n（提出済みの振り返りは残ります）'}\nよろしいですか？`))return;
  await delMany('roster',rs.map(r=>r.id));if(es.length)await delMany('entries',es.map(e=>e.id));rs.forEach(r=>R.sel.delete(r.id));
}
function drawRoster(){
  const rg=$('#rg');if(!rg)return;const rs=cache.roster.filter(r=>r.year===R.y),cs=[...new Set(rs.map(r=>r.cls))].sort(nat);
  const done=new Set(cache.entries.filter(e=>e.year===R.y).map(e=>e.cls+'|'+e.no));
  $('#rinfo').textContent=`${cs.length}クラス・${rs.length}人（提出済み ${rs.filter(r=>done.has(r.cls+'|'+r.no)).length}人）`;
  rg.innerHTML=cs.length?cs.map(c=>{const a=rs.filter(r=>r.cls===c).sort((x,y)=>nat(x.no,y.no));
    return`<div class="cl"><h4>${esc(c)}組（${a.length}人）<button class="s" data-ca="${esc(c)}">全選択/解除</button><button class="d" data-cd="${esc(c)}">このクラスを全削除</button></h4>${a.map(r=>`<span class="chip${R.sel.has(r.id)?' on':''}${done.has(r.cls+'|'+r.no)?' done':''}" data-r="${r.id}">${esc(r.no)}</span>`).join('')}</div>`}).join(''):'<p class="hint">この年度の名簿はまだありません。上の欄から登録してください。</p>';
  $$('[data-r]',rg).forEach(c=>c.onclick=()=>{R.sel.has(c.dataset.r)?R.sel.delete(c.dataset.r):R.sel.add(c.dataset.r);c.classList.toggle('on')});
  $$('[data-ca]',rg).forEach(b=>b.onclick=()=>{const ids=rs.filter(r=>r.cls===b.dataset.ca).map(r=>r.id),all=ids.every(i=>R.sel.has(i));ids.forEach(i=>all?R.sel.delete(i):R.sel.add(i));drawRoster()});
  $$('[data-cd]',rg).forEach(b=>b.onclick=()=>rdel(rs.filter(r=>r.cls===b.dataset.cd),b.dataset.cd+'組の'));
}
route();
</script></body></html>
